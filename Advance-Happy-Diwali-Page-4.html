<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Happy Diwali - Page 4</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a2a, #1a1a4a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .gift-box {
            width: 150px;
            height: 150px;
            background: gold;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: #000;
            cursor: pointer;
            animation: float 2s infinite ease-in-out;
            box-shadow: 0 0 20px gold, 0 0 40px orange;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .gift-box.clicked {
            animation: burst 0.5s forwards;
        }
        @keyframes burst {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        .message {
            margin-top: 2rem;
            color: gold;
            font-size: 1.5rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .message.show {
            opacity: 1;
        }
        .task-link {
            display: block;
            margin: 2rem auto;
            padding: 1rem 2rem;
            background: gold;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .task-link.show {
            opacity: 1;
        }
        .final-btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            background: gold;
            color: #000;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .final-btn.show {
            opacity: 1;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="gift-box" id="giftBox">🎁</div>
    <div class="message" id="message">Wow! You unlocked it! Now complete the small task below</div>
    <a href="https://mass-visit-vids-enjoy.trycloudflare.com" class="task-link" id="taskLink">Complete My Cloud Task Here</a>
    <button class="final-btn" id="finalBtn" onclick="window.location.href='website5.html'">FINAL GIFT ✨</button>
    <canvas id="fireworksCanvas"></canvas>
    <script>
        const giftBox = document.getElementById('giftBox');
        const message = document.getElementById('message');
        const taskLink = document.getElementById('taskLink');
        const finalBtn = document.getElementById('finalBtn');
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 10,
                    y: (Math.random() - 0.5) * 10
                };
                this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02;
            }
        }

        function createFirework(x, y) {
            const colors = ['#FFD700', '#FFA500', '#FF4500', '#FFFFFF'];
            for (let i = 0; i < 50; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        giftBox.addEventListener('click', () => {
            giftBox.classList.add('clicked');
            setTimeout(() => {
                message.classList.add('show');
                taskLink.classList.add('show');
                finalBtn.classList.add('show');
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createFirework(Math.random() * canvas.width, Math.random() * canvas.height);
                    }, i * 200);
                }
            }, 500);
        });

        animate();
    </script>
</body>
</html>
