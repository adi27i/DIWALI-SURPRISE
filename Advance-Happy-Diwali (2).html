<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Happy Diwali</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a2a, #1a1a4a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid gold;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 0 20px gold, 0 0 40px orange;
            animation: glow 2s infinite alternate;
            max-width: 90%;
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px gold, 0 0 40px orange; }
            to { box-shadow: 0 0 30px gold, 0 0 60px orange; }
        }
        h1 {
            color: gold;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .yes-btn {
            background: gold;
            color: #000;
        }
        .no-btn {
            background: #ff4500;
            color: #fff;
            position: relative;
        }
        .no-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        @media (max-width: 768px) {
            .no-btn.disabled::after {
                content: " NO 😜 Disabled";
                position: absolute;
                top: -30px;
                left: 50%;
                transform: translateX(-50%);
                color: gold;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🪔 Advance Happy Diwali</h1>
        <p>Ready for your surprise journey?</p>
        <div class="buttons">
            <button class="yes-btn" onclick="window.location.href='website2.html'">YES</button>
            <button class="no-btn" id="noBtn">NO</button>
        </div>
    </div>
    <script>
        const noBtn = document.getElementById('noBtn');
        let isMobile = window.innerWidth <= 768;

        if (isMobile) {
            noBtn.classList.add('disabled');
            noBtn.addEventListener('click', () => window.location.href = 'website2.html');
        } else {
            document.addEventListener('mousemove', (e) => {
                const rect = noBtn.getBoundingClientRect();
                const btnX = rect.left + rect.width / 2;
                const btnY = rect.top + rect.height / 2;
                const dx = e.clientX - btnX;
                const dy = e.clientY - btnY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 100) {
                    const moveX = (dx > 0 ? -1 : 1) * 50;
                    const moveY = (dy > 0 ? -1 : 1) * 50;
                    noBtn.style.transform = `translate(${moveX}px, ${moveY}px)`;
                } else {
                    noBtn.style.transform = 'translate(0, 0)';
                }
            });
        }
    </script>
</body>
</html>
